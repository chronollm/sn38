[project]
name = "sn38-chronollm"
version = "0.1.0"
description = "SN38 ChronoLLM Subnet"
requires-python = ">=3.11"
dependencies = [
    "bittensor>=8.0.0,<11.0.0",
    "torch>=2.0",
    "transformers>=4.48.0",
    "huggingface_hub>=1.23.0",
    "hf-xet>=1.5.2rc0",
    "numpy>=1.0",
    "requests>=2.0",
    "tiktoken>=0.5.0",
    "openai>=1.0.0",
    "dstack-sdk>=0.1.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["sn38*"]
