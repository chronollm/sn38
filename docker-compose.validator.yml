version: '3.8'
services:
  validator:
    image: chronollm/sn38-validator@sha256:136e55bbcca07f9573a938a6c4d7dd4858809e03db5d9b4a446a2feebd864fc3

    restart: "on-failure"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - validator-data:/app/data
    environment:
      - NETUID=38
      - SUBTENSOR_NETWORK=finney
      - BACKEND_URL=https://api.sn38.chronollm.com
      - DATA_DIR=${DATA_DIR:-/app/data}
      # base for the per-round hub + xet caches, on the persistent volume
      - HF_HOME=${DATA_DIR:-/app/data}/hf
      # This secret is encrypted client-side by Phala CLI before transmission
      - WALLET_NAME=validator
      - HOTKEY_FILE_CONTENT=${HOTKEY_FILE_CONTENT}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - HF_DEBUG=${HF_DEBUG:-0}
    command: ["python", "-m", "sn38.neurons.validator"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  validator-data:
